<h1>中國AI模型突破測試沙盒　引發資安風險疑慮</h1>
<p>Fri, 07 Aug 2026 18:49:14 +0800</p>
<div>（中央社華盛頓6日綜合外電報導）美國資安研究公司Frontier Security今天表示，中國人工智慧（AI）新創公司月之暗面旗艦AI模型突破英國「AI安全研究院」（AI Safety Institute）開發的網路安全測試環境，引發先進AI模型的資安風險疑慮。</div>
