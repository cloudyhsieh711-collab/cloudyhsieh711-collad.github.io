<h1>OpenAI示警新模型Astra恐具關鍵資安能力　收緊研發管控</h1>
<p>Sat, 08 Aug 2026 09:39:53 +0800</p>
<div>（中央社華盛頓7日綜合外電報導）OpenAI今天表示，由於無法排除即將推出的人工智慧（AI）模型「Astra」具備的「關鍵」網路安全能力，因此已暫停部分內部開發作業，並啟動安全防護機制。</div>
