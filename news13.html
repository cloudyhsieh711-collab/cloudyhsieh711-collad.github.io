<h1>SpaceX特斯拉斥資逾5400億　在德州合作建AI晶片廠</h1>
<p>Fri, 07 Aug 2026 10:18:23 +0800</p>
<div>（中央社葛林姆斯郡6日綜合外電報導）馬斯克旗下SpaceX和特斯拉初期將投入168億美元（約新台幣5408億元），在美國德州葛林姆斯郡興建先進AI半導體園區Terafab，全力爭取對未來發展至關重要的晶片產能。</div>
