<h1>Meta AI模型測試期間入侵其他公司　引資安風險疑慮</h1>
<p>Thu, 06 Aug 2026 10:45:22 +0800</p>
<div>（中央社華盛頓5日綜合外電報導）社群媒體巨擘Meta今天表示，旗下一款人工智慧（AI）模型在網路安全測試期間入侵另一家公司系統，引發外界擔憂開發商能否有效管控日益強大的AI系統。</div>
