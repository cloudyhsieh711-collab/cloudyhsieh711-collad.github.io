<h1>AI設計全新病毒可滅大腸桿菌　史丹佛研究引發生物安全隱憂</h1>
<p>Fri, 07 Aug 2026 10:36:36 +0800</p>
<div>（中央社華盛頓6日綜合外電報導）一個由史丹佛大學主導的研究團隊利用人工智慧創造出自然界從未出現過的合成病毒，可殺滅大腸桿菌。然而這也引發這項技術未來可能被用設計危險病原體或生物武器的隱憂。</div>
