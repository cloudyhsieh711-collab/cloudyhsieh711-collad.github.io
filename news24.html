<h1>因應AI安全風險　美專家：關鍵在建構防禦又不拖慢創新</h1>
<p>Sat, 08 Aug 2026 09:17:46 +0800</p>
<div>（中央社記者侯姿瑩華盛頓7日專電）美國科技公司OpenAI和Anthropic披露旗下AI工具在測試過程中入侵其他公司系統，引發外界對AI代理失控疑慮升高。專家向中央社分析，關鍵在於建構一套防禦系統，同時又不至於訴諸執照許可制度，以免不合理拖慢開發速度。</div>
