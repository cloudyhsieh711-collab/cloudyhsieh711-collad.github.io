<h1>NEO發表AI記憶體新技術　施振榮：帶來半導體新可能</h1>
<p>Thu, 06 Aug 2026 10:57:33 +0800</p>
<div>（中央社記者吳家豪台北6日電）由矽谷華人許富菖創立的人工智慧（AI）記憶體公司NEO Semiconductor，今天在全球記憶體與儲存產業年度盛會Future Memory and Storage（FMS 2026）發表新一代AI晶片內建記憶體技術X-SRAM，並同步推出NEO.AI平台，解決AI晶片內建記憶體容量不足等挑戰。</div>
